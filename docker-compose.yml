services:
  redis:
    image: redis:7-alpine
    container_name: redis-job-queue-redis
    restart: unless-stopped

  api:
    build: .
    container_name: redis-job-queue-api
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 3000
    command: ["node", "dist/api.js"]
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build: .
    container_name: redis-job-queue-worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["node", "dist/worker.js", "worker-A"]